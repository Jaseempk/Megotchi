<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Megotchi — live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#FFF6EA; --ink:#46352C; --soft:#7A685C; --line:#EADFCE;
         --persimmon:#D64F31; --honey:#FFC45E; --card:#FFFDF6; --good:#4C8A5C; }
  *{ box-sizing:border-box; margin:0; }
  body{ background:var(--paper); color:var(--ink); font-family:"Fredoka",system-ui,sans-serif;
        padding:20px 14px 60px; }
  .wrap{ max-width:780px; margin:0 auto; }
  h1{ font-size:1.3rem; font-weight:600; }
  .sub{ color:var(--soft); font-size:.8rem; margin:2px 0 18px; }
  h2{ font-size:.95rem; font-weight:600; margin:26px 0 10px; color:var(--soft);
      text-transform:uppercase; letter-spacing:.06em; }
  .cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:10px; }
  .card{ background:var(--card); border:1.5px solid var(--line); border-radius:14px;
         padding:12px 14px; }
  .card .v{ font-size:1.5rem; font-weight:600; }
  .card .v.live{ color:var(--good); }
  .card .v.warn{ color:var(--persimmon); }
  .card .k{ font-size:.72rem; color:var(--soft); margin-top:2px; }
  .bars{ display:flex; align-items:flex-end; gap:4px; height:120px;
         background:var(--card); border:1.5px solid var(--line); border-radius:14px;
         padding:14px 14px 26px; position:relative; }
  .bar{ flex:1; background:var(--honey); border-radius:5px 5px 2px 2px; min-height:2px;
        position:relative; }
  .bar.today{ background:var(--persimmon); }
  .bar .n{ position:absolute; top:-16px; width:100%; text-align:center; font-size:.62rem; color:var(--soft); }
  .bar .d{ position:absolute; bottom:-20px; width:100%; text-align:center; font-size:.56rem;
           color:var(--soft); white-space:nowrap; }
  table{ width:100%; border-collapse:collapse; background:var(--card);
         border:1.5px solid var(--line); border-radius:14px; overflow:hidden; font-size:.82rem; }
  th,td{ padding:8px 10px; text-align:left; border-bottom:1px solid var(--line); }
  th{ color:var(--soft); font-weight:500; font-size:.7rem; text-transform:uppercase; }
  tr:last-child td{ border-bottom:none; }
  td.num, th.num{ text-align:right; }
  .fresh{ color:var(--good); font-weight:600; }
  .chip{ display:inline-block; background:var(--card); border:1.5px solid var(--line);
         border-radius:999px; padding:4px 12px; margin:0 6px 6px 0; font-size:.78rem; }
  .chip b{ color:var(--persimmon); }
  .note{ color:var(--soft); font-size:.78rem; margin-top:6px; }
  #err{ display:none; background:#FBE7E1; border:1.5px solid var(--persimmon);
        color:var(--persimmon); border-radius:14px; padding:14px; margin-top:14px; font-size:.9rem; }
  .tblwrap{ overflow-x:auto; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Megotchi — live</h1>
  <div class="sub" id="sub">loading…</div>
  <div id="err"></div>
  <div id="main" style="display:none">

    <div class="cards" id="nowCards"></div>

    <h2>Spend — AI credits</h2>
    <div class="cards" id="spendCards"></div>
    <div class="note" id="spendNote"></div>

    <h2>Sessions — last 14 days <span style="text-transform:none">(UTC)</span></h2>
    <div class="bars" id="bars"></div>
    <div class="note" id="barNote"></div>

    <h2>Retention & session quality</h2>
    <div class="cards" id="pmfCards"></div>
    <div class="note" id="longestNote"></div>

    <h2>Kids</h2>
    <div class="tblwrap"><table id="kidsTbl"></table></div>

    <h2>What works — opener scoreboard</h2>
    <div class="tblwrap"><table id="flavTbl"></table></div>
    <div class="note" id="probeNote"></div>

    <h2>Funnel & health — last 7 days</h2>
    <div class="cards" id="funCards"></div>
    <div id="exprChips" style="margin-top:10px"></div>
  </div>
</div>

<script>
(function(){
  const key = new URLSearchParams(location.search).get("key") || "";
  const $ = s => document.querySelector(s);

  function ago(min){
    if (min < 1) return "now";
    if (min < 60) return min + "m ago";
    if (min < 1440) return Math.round(min/60) + "h ago";
    return Math.round(min/1440) + "d ago";
  }
  function card(v, k, cls){ return `<div class="card"><div class="v ${cls||""}">${v}</div><div class="k">${k}</div></div>`; }
  function pct(r){ return r.eligible ? Math.round(100*r.returned/r.eligible) + "%" : "—"; }
  function frac(r){ return r.eligible ? ` (${r.returned}/${r.eligible})` : ""; }

  async function load(){
    let j;
    try{
      const r = await fetch("/api/stats?key=" + encodeURIComponent(key), {cache:"no-store"});
      if (r.status === 403){ $("#err").style.display="block";
        $("#err").textContent = "Locked — open this page with ?key=YOUR_KEY in the URL."; return; }
      j = await r.json();
    }catch(e){ $("#sub").textContent = "can't reach the server — retrying…"; return; }
    $("#err").style.display = "none"; $("#main").style.display = "block";
    $("#sub").textContent = "updated " + new Date(j.generated*1000).toLocaleTimeString() + " · refreshes every 15s";

    // now strip
    const b = j.now.budget || {};
    $("#nowCards").innerHTML =
      card(j.now.active_now.length, "talking right now", j.now.active_now.length ? "live" : "") +
      card(j.now.kids_today, "kids today") +
      card(j.now.turns_today, "turns today") +
      card((b.used ?? "?") + " / " + (b.cap ?? "?"), "daily budget used",
           b.cap && b.used > b.cap*0.8 ? "warn" : "") +
      card(j.funnel.errors_today, "errors today", j.funnel.errors_today ? "warn" : "") +
      card(j.funnel.rate_limited_today, "blocked today", j.funnel.rate_limited_today ? "warn" : "");
    if (j.now.active_now.length)
      $("#nowCards").innerHTML += card(j.now.active_now.join(", "), "who's on", "live");

    // spend
    const sp = j.spend || {};
    const f$ = v => v == null ? "—" : "$" + v.toFixed(v < 1 ? 3 : 2);
    if (sp.all){
      let cards =
        card(f$(sp.today.total_usd), "today (est.)") +
        card(f$(sp.wk.total_usd), "last 7 days") +
        card(f$(sp.all.total_usd), "since metering began") +
        card(sp.per_interaction != null ? "$" + sp.per_interaction.toFixed(3) : "—",
             "per interaction");
      if (sp.eleven && sp.eleven.limit){
        const p = Math.round(100 * sp.eleven.used / sp.eleven.limit);
        cards += card(p + "%", `TTS quota (${sp.eleven.used.toLocaleString()} / ${sp.eleven.limit.toLocaleString()} ch)`,
                      p > 80 ? "warn" : "");
        if (sp.tts_days_left != null)
          cards += card(sp.tts_days_left + "d", "TTS lasts at this pace",
                        sp.tts_days_left < 7 ? "warn" : "");
      }
      $("#spendCards").innerHTML = cards;
      $("#spendNote").textContent =
        `OpenAI: exact tokens × list price · ElevenLabs: est. $${sp.tts_usd_per_1k}/1k chars` +
        ` (tune via MEGOTCHI_TTS_USD_PER_1K_CHARS)` +
        (sp.eleven && sp.eleven.limit ? " · quota card = ElevenLabs' official meter" : "");
    }

    // 14-day bars
    const mx = Math.max(1, ...j.days.map(d => d.sessions));
    $("#bars").innerHTML = j.days.map((d,i) =>
      `<div class="bar ${i===13?"today":""}" style="height:${Math.max(2, d.sessions/mx*100)}%">
         <div class="n">${d.sessions||""}</div>
         ${i%2===1 ? `<div class="d">${d.d.split(" ")[0]}</div>` : ""}
       </div>`).join("");
    const wk = j.days.slice(7).reduce((a,d)=>a+d.sessions,0),
          pw = j.days.slice(0,7).reduce((a,d)=>a+d.sessions,0);
    $("#barNote").textContent = `sessions this week: ${wk} · previous week: ${pw}` +
      (pw ? ` · ${wk>=pw?"+":""}${Math.round(100*(wk-pw)/pw)}% week-over-week` : "");

    // retention + quality
    $("#pmfCards").innerHTML =
      card(pct(j.retention.d1), "D1 return" + frac(j.retention.d1)) +
      card(pct(j.retention.d7), "D7 return" + frac(j.retention.d7)) +
      card(pct(j.retention.d30), "D30 return" + frac(j.retention.d30)) +
      card(j.quality.avg_turns, "avg turns / session") +
      card(j.quality.avg_minutes + "m", "avg session length") +
      card(j.quality.total_sessions, "sessions all-time");
    const L = j.quality.longest, T = j.quality.longest_today;
    $("#longestNote").textContent =
      (L ? `longest ever: ${L.child} — ${L.turns} turns, ${L.minutes}m (${L.date})` : "no sessions yet") +
      (T ? ` · longest today: ${T.child} — ${T.turns} turns, ${T.minutes}m` : "");

    // kids table
    $("#kidsTbl").innerHTML =
      "<tr><th>kid</th><th>last seen</th><th class=num>sessions (7d)</th>" +
      "<th class=num>turns</th><th class=num>avg turns/sess</th><th class=num>avg words</th><th>since</th></tr>" +
      j.kids.map(k =>
        `<tr><td><b>${k.child}</b></td>
         <td class="${k.last_seen_min<10?"fresh":""}">${ago(k.last_seen_min)}</td>
         <td class=num>${k.sessions_7d} <span style="color:var(--soft)">/ ${k.sessions}</span></td>
         <td class=num>${k.turns}</td><td class=num>${k.avg_turns}</td>
         <td class=num>${k.avg_words}</td><td>${k.first_seen}</td></tr>`).join("");

    // flavors
    $("#flavTbl").innerHTML =
      "<tr><th>opener</th><th class=num>times used</th><th class=num>avg turns kid stays after</th></tr>" +
      (j.flavors.length ? j.flavors.map(f =>
        `<tr><td>${f.flavor}</td><td class=num>${f.greets}</td><td class=num><b>${f.avg_turns_after}</b></td></tr>`).join("")
       : "<tr><td colspan=3 style='color:var(--soft)'>no greetings tracked yet</td></tr>");
    $("#probeNote").textContent = j.probes.fired
      ? `day-questions: ${j.probes.fired} asked · ${j.probes.answered} answered ` +
        `(${Math.round(100*j.probes.answered/j.probes.fired)}%) · avg answer ${j.probes.avg_words} words`
      : "no day-questions tracked yet";

    // funnel & health
    $("#funCards").innerHTML =
      card(j.funnel.page_open_7d, "page opens") +
      card(j.funnel.talkers_7d, "kids who talked") +
      card(j.funnel.mic_denied_7d, "mic denied", j.funnel.mic_denied_7d ? "warn" : "") +
      card(j.funnel.stt_fail_7d, "didn't-hear errors", j.funnel.stt_fail_7d ? "warn" : "") +
      card(j.latency.avg_ms ? (j.latency.avg_ms/1000).toFixed(1)+"s" : "—", "avg response time") +
      card(j.latency.p90_ms ? (j.latency.p90_ms/1000).toFixed(1)+"s" : "—", "p90 response time");
    const tot = Object.values(j.expressions).reduce((a,x)=>a+x,0);
    $("#exprChips").innerHTML = tot
      ? "moods this week: " + Object.entries(j.expressions).sort((a,b)=>b[1]-a[1])
          .map(([e,n]) => `<span class="chip">${e} <b>${Math.round(100*n/tot)}%</b></span>`).join("")
      : "";
  }

  load();
  setInterval(load, 15000);
})();
</script>
</body>
</html>
